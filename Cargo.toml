[package]
name = "glasspane"
version = "0.1.0"
edition = "2024"
description = "A live Git dashboard with safe branch switching and shell access"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
crossterm = "0.29"
directories = "6"
libc = "0.2"
git2 = { version = "0.21", default-features = false, features = ["vendored-libgit2"] }
notify = "8"
notify-debouncer-mini = "0.7"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
toml = "1"
unicode-segmentation = "1"
unicode-width = "0.2"

tempfile = "3"
